[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-skills-plotting"
version = "0.1.0"
description = "Plotly figures from weather-skills standard dataset Zarrs; the plot spec is a standard Plotly figure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "weather-skills-core @ git+https://github.com/rhiza-research/weather-skills-core@dev",
    "cf-xarray>=0.11",
    "cftime>=1.6",
    "numpy>=2.5",
    "xarray>=2026.7",
    "zarr>=3.2",
    "pint-xarray>=0.6",
    # cartopy only downloads and caches the Natural Earth overlay shapefiles.
    "cartopy",
    "shapely>=2.1.2",
    "plotly>=7.1",
    # PNG/JPG export drives a headless Chrome. kaleido uses an installed Chrome,
    # or run `plotly_get_chrome -y` once to fetch one.
    "kaleido>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/weather_skills_plotting"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
pythonpath = ["tests"]
markers = ["overlays: draw real Natural Earth overlays (downloads on first use)"]
filterwarnings = [
    # zarr-python warns on every consolidated write; consolidated=True is part
    # of the standard dataset contract, so the warning is expected noise in tests.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
