# The standard weather-skills plot look.
#
# A --theme-file (JSON or TOML) has the same four sections. Anything it sets
# is layered on top of this file, so a theme only lists what it changes.
# Copy this file to start one.

# ---------------------------------------------------------------- template
# A Plotly template (https://plotly.com/python/templates/), applied on top of
# Plotly's "seaborn" template. It makes the "weather_skills" template that
# every figure uses unless the spec sets layout.template. The "colorblind"
# template gets the same settings but keeps its own colorblind-safe colorway.

[template.layout]
# Line and marker colors, in order (seaborn "deep").
colorway = [
    "#4c72b0", "#dd8452", "#55a868", "#c44e52", "#8172b3",
    "#937860", "#da8bc3", "#8c8c8c", "#ccb974", "#64b5cd",
]

# seaborn's shapes have no line and a blue fill, so a box given only a line
# color draws as a tinted patch. A shape is an outline unless it sets a fill.
[template.layout.shapedefaults]
fillcolor = "rgba(0,0,0,0)"
opacity = 1
line = { width = 2, color = "#333333" }

# ---------------------------------------------------------------- palettes
# Named class palettes for meta.palette and for [defaults]:
#   {colors = [...], bounds = [...]} draws one color per class between bounds;
#   colors alone draws a continuous scale.
# Built in (defined in palettes.py, from CHC IDL tables):
#   ppt_daily, ppt_week, ppt_month, ppt_season
#   ppt_anom_daily, ppt_anom_week, ppt_anom_month, ppt_anom_season
#   ppt_total, ppt_short, chirps_total, chirps_short, ppt_poa, ppt_spp, spi, rocket
# default_precip / default_precip_anom are not palettes of their own: they
# pick ppt_daily … ppt_season (or ppt_anom_*) from the field's
# aggregation_period. An entry here adds a palette, or replaces a built-in
# one of the same name (default_precip included).

[palettes]

# ---------------------------------------------------------------- defaults
# The color a field gets when the spec names no palette or colorscale, by
# kind. A value is a palette name from [palettes], a color list, a
# {colors, bounds} table, or a Plotly colorscale name (Viridis, RdBu_r, …).
# The kind is read from the field: precipitation and wind speed from its
# name and CF attributes; otherwise "diverging" when the color range
# straddles zero, then "temperature", else "sequential".

[defaults]
precip = "default_precip"
precip_anomaly = "default_precip_anom"
precip_poa = "ppt_poa"
spi = "spi"
wind_speed = "YlGn"
diverging = "RdBu_r"
temperature = "RdYlBu_r"
sequential = "rocket"

# ---------------------------------------------------------------- overlays
# Plotly scatter line styles for the base-map layers, drawn in this order
# (later on top). A spec's layout.meta.overlays turns layers on or off.
# Water is slate (#708090), so lakes and rivers never read as rainfall blues.

[overlays.admin1]
line = { color = "#737373", width = 0.6 }

[overlays.rivers]
line = { color = "#708090", width = 0.6 }

# Shoreline only: a filled lake hid the data over it (Lake Victoria is among
# the wettest cells).
[overlays.lakes]
line = { color = "#4d5b6b", width = 0.9 }

[overlays.borders]
line = { color = "#262626", width = 1.2 }

[overlays.coastline]
line = { color = "black", width = 1.2 }
